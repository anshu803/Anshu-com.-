<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Membership Plans</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }

        .title {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .plans-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .plan-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 25px;
            width: 280px;
            text-align: left;
        }

        .plan-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .price span {
            text-decoration: line-through;
            color: #64748b;
            font-size: 16px;
        }

        .btn-buy {
            display: block;
            text-align: center;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1 class="title">Choose Your VIP Access Plan</h1>
    <p style="color: #94a3b8;">Select a package to upgrade your account</p>

    <div class="plans-container">
        <div class="plan-card">
            <div class="plan-title">ZIP FILES PACKAGE</div>
            <div class="price"><span>₹999</span> ₹399</div>
            <p>• Lifetime VIP Access</p>
            <p>• Direct Download Server</p>
            <a href="/logout" class="btn-buy">Subscribe via Bot</a>
        </div>

        <div class="plan-card">
            <div class="plan-title">PREMIUM COLLECTION</div>
            <div class="price"><span>₹259</span> ₹69</div>
            <p>• Daily Updates</p>
            <p>• HD Video Streaming</p>
            <a href="/logout" class="btn-buy">Subscribe via Bot</a>
        </div>
    </div>

</body>
  </html>
