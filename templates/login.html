<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kushal Panel - Login & Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #1d152c, #2b1055, #7597de, #240b36);
            background-size: 400% 400%;
            animation: gradientAnim 12s ease infinite;
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
            color: #fff;
            text-align: center;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d1d5db;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
        }

        .toggle-btn {
            margin-top: 20px;
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- LOGIN FORM -->
    <div class="container" id="loginBox">
        <h2>Welcome Back</h2>
        <form action="/login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter Username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="toggle-btn" onclick="toggleForm()">Create New Account</div>
    </div>

    <!-- SIGNUP FORM -->
    <div class="container" id="signupBox" style="display: none;">
        <h2>Create Account</h2>
        <form action="/signup" method="POST">
            <div class="input-group">
                <label>Choose Username</label>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <label>Choose Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" style="background: linear-gradient(135deg, #00b09b, #96c93d);">Register & View Plans</button>
        </form>
        <div class="toggle-btn" onclick="toggleForm()">Already have an account? Login</div>
    </div>

    <script>
        function toggleForm() {
            var loginBox = document.getElementById('loginBox');
            var signupBox = document.getElementById('signupBox');
            if (loginBox.style.display === "none") {
                loginBox.style.display = "block";
                signupBox.style.display = "none";
            } else {
                loginBox.style.display = "none";
                signupBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
